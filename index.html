  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">

  <link rel="stylesheet" href="css/style.css">
  <script>
    // Тема до отрисовки, чтобы не было вспышки
    try { const th = localStorage.getItem("safar_theme"); if (th) document.documentElement.dataset.theme = th; } catch {}
    // Крупный текст — тоже до отрисовки
    try { if (localStorage.getItem("safar_big") === "1") document.documentElement.classList.add("big"); } catch {}
    // Размер текста, шрифт и прочие настройки «Aa» (js/display.js)
    try {
      const d = JSON.parse(localStorage.getItem("safar_display") || "null"), r = document.documentElement;
      r.classList.add("fs-text");   // растут только буквы, а не вся страница (css: --fz)
      if (d) {
        r.style.setProperty("--uz", (d.size || 100) / 100);
        r.classList.toggle("big", d.size >= 115);
        if (d.font) r.dataset.font = d.font;
        if (d.bold) r.classList.add("bold-text");
        if (d.spacing) r.classList.add("airy");
        if (d.calm) r.classList.add("calm");
      } else if (r.classList.contains("big")) r.style.setProperty("--uz", 1.15);
    } catch {}
    // SEO-адреса /city/<id> и /place/<id> → маршрут приложения #city/<id> (язык из ?lang=)
    (() => {
      const m = location.pathname.match(/^\/(city|place)\/([\w-]+)\/?$/);
      const lang = new URLSearchParams(location.search).get("lang");
      try { if (lang && ["uz", "ru", "en"].includes(lang)) localStorage.setItem("safar_lang", lang); } catch {}
      if (m) history.replaceState(null, "", "/#" + m[1] + "/" + m[2]);
    })();
    // Сохранённое направление открывается сразу; сменить направление можно из аккаунта.
    // Первый вход (направление ещё не выбрано) — сразу приложение «Азербайджан» (/az).
    // Прямые ссылки на узбекский раздел (#city/…, ?start=…, Telegram) открываются здесь, как раньше.
    try {
      const raw = localStorage.getItem("safar_region"), region = raw && raw.replace(/"/g, "");
      const deep = (location.hash && !/^#(home)?$/.test(location.hash)) || location.search || /tgWebApp/.test(location.hash);
      if (["/", "/index.html"].includes(location.pathname)) {
        if (!deep && region === "mecca") location.replace("/mecca");
        else if (!deep && region !== "uz") location.replace("/az");
      }
    } catch {}
    // Telegram Mini App: скрипт Telegram нужен только внутри Telegram
    if (/tgWebApp/.test(location.hash + location.search)) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
  </script>
  <script>
    (() => {
      const wa = window.Telegram && window.Telegram.WebApp;
      const inTg = wa && wa.initData;
      if (inTg) {
        document.documentElement.dataset.theme = wa.colorScheme === "light" ? "light" : "dark";
        document.documentElement.classList.add("in-telegram");
      }
      // Ссылки из бота: ?start=city_samarkand или параметр startapp Mini App → #city/samarkand
      const start = (inTg && wa.initDataUnsafe && wa.initDataUnsafe.start_param) || new URLSearchParams(location.search).get("start");
      if (start && /^(city|place|collection|trip|guide|account|tickets)_[\w-]+$/.test(start)) history.replaceState(null, "", "/#" + start.replace("_", "/"));
      else if (start && /^(trains|safety|prices|offline|budget|map|favs|account|tickets)$/.test(start)) history.replaceState(null, "", "/#" + start);
      else if (inTg && /tgWebApp/.test(location.hash)) history.replaceState(null, "", location.pathname + "#home");
    })();
  </script>
</head>

            <option value="rating" data-i18n="sort_rating"></option>
            <option value="dist" data-i18n="sort_dist"></option>
          </select>
          <button class="btn ghost near-btn" data-near="citySort"><svg class="i i-locate" aria-hidden="true"><use href="#i-locate"/></svg><span data-i18n="near_me"></span></button>
        </div>
        <p class="hint count" id="cityFound"></p>
        <div id="cityGrid" class="grid"></div>
      </section>

      <!-- Отели -->
      <section id="tab-hotels" class="tab">
        <div class="filters">
          <input id="hotelSearch" type="search" data-i18n-ph="search_ph">
          <select id="hotelCity"></select>
          <select id="hotelType"></select>
          <select id="hotelStars"></select>
          <select id="hotelSort">
            <option value="stars" data-i18n="sort_stars"></option>
            <option value="price" data-i18n="sort_price_asc"></option>
            <option value="-price" data-i18n="sort_price_desc"></option>
            <option value="rating" data-i18n="sort_rating"></option>
            <option value="dist" data-i18n="sort_dist"></option>
          </select>
          <button class="btn ghost near-btn" data-near="hotelSort"><svg class="i i-locate" aria-hidden="true"><use href="#i-locate"/></svg><span data-i18n="near_me"></span></button>
        </div>
        <p class="hint count"><span id="hotelFound"></span> · <span data-i18n="price_note"></span></p>
        <div id="hotelList" class="list"></div>
      </section>

      <!-- Места -->
      <section id="tab-places" class="tab">
        <div class="seg" id="placeCat">
          <button data-cat="a" class="active"><svg class="i i-dome" aria-hidden="true"><use href="#i-dome"/></svg><span data-i18n="cat_a"></span></button>
          <button data-cat="s"><svg class="i i-shopping" aria-hidden="true"><use href="#i-shopping"/></svg><span data-i18n="cat_s"></span></button>
          <button data-cat="f"><svg class="i i-food" aria-hidden="true"><use href="#i-food"/></svg><span data-i18n="cat_f"></span></button>
        </div>
        <div class="filters">
          <input id="placeSearch" type="search" data-i18n-ph="search_ph">
          <select id="placeCity"></select>
          <select id="placeType"></select>
          <select id="placeSort">
            <option value="info" data-i18n="sort_info"></option>
            <option value="rating" data-i18n="sort_rating"></option>
            <option value="name" data-i18n="sort_name"></option>
            <option value="dist" data-i18n="sort_dist"></option>
          </select>
          <select id="placeCuisine" class="hidden"></select>
          <label class="btn ghost toggle"><input type="checkbox" id="placeOpen"><span class="dot-open"></span><span data-i18n="only_open"></span></label>
          <button class="btn ghost near-btn" data-near="placeSort"><svg class="i i-locate" aria-hidden="true"><use href="#i-locate"/></svg><span data-i18n="near_me"></span></button>
        </div>
        <div class="chips food-flags hidden" id="foodFlags"></div>
        <p class="hint count" id="placeFound"></p>
        <div id="placeList" class="list"></div>
      </section>

      <!-- Бюджет -->
      <section id="tab-budget" class="tab">
        <div class="budget">
          <div class="panel">
            <h3><svg class="i i-route" aria-hidden="true"><use href="#i-route"/></svg><span data-i18n="route_title"></span></h3>
            <p class="hint" data-i18n="route_hint"></p>
            <div class="route-add">
              <input id="routeCity" list="cityList" data-i18n-ph="city_ph" autocomplete="off">
              <datalist id="cityList"></datalist>
              <input id="routeNights" type="number" min="0" value="2" aria-label="nights">
              <button id="routeAddBtn" class="btn" data-i18n="add"></button>
            </div>
            <label class="trip-date"><svg class="i i-calendar" aria-hidden="true"><use href="#i-calendar"/></svg><span data-i18n="trip_start"></span> <input type="date" id="tripStart"></label>
            <ol id="routeList" class="route-list"></ol>
            <div id="routeMap"></div>

            <h3><svg class="i i-filter" aria-hidden="true"><use href="#i-filter"/></svg><span data-i18n="params"></span></h3>
            <div class="form-grid">
              <label><span data-i18n="travelers"></span><input id="bPeople" type="number" min="1" value="2"></label>
              <label><span data-i18n="rooms"></span><input id="bRooms" type="number" min="1" value="1"></label>
              <label><span data-i18n="hotel_class"></span>
                <select id="bHotel"><option value="2">2 ★</option><option value="3" selected>3 ★</option><option value="4">4 ★</option><option value="5">5 ★</option></select>
              </label>
              <label><span data-i18n="food"></span>
                <select id="bFood">
                  <option value="budget" data-i18n="food_budget"></option>
                  <option value="mid" data-i18n="food_mid" selected></option>
                  <option value="premium" data-i18n="food_premium"></option>
                </select>
              </label>
              <label><span data-i18n="transport"></span><select id="bTransport"></select></label>
              <label><span data-i18n="shopping_pp"></span><input id="bShopping" type="number" min="0" value="100"></label>
            </div>

            <details class="rates">
              <summary><svg class="i i-edit" aria-hidden="true"><use href="#i-edit"/></svg><span data-i18n="rates_edit"></span></summary>
              <div id="tariffEditor" class="form-grid"></div>
              <button id="resetTariffs" class="btn ghost"><svg class="i i-reset" aria-hidden="true"><use href="#i-reset"/></svg><span data-i18n="reset"></span></button>
            </details>
          </div>

          <div class="panel result">
            <h3><svg class="i i-wallet" aria-hidden="true"><use href="#i-wallet"/></svg><span data-i18n="total"></span></h3>
            <div id="budgetTotal" class="total"></div>
            <div id="budgetBar" class="bar"></div>
            <ul id="budgetBreakdown" class="breakdown"></ul>
            <button id="copyBudget" class="btn ghost"><svg class="i i-copy" aria-hidden="true"><use href="#i-copy"/></svg><span data-i18n="copy"></span></button>
            <p class="hint" data-i18n="budget_note"></p>
          </div>
        </div>
        <section class="panel trip-days">
          <div class="block-head"><h2><svg class="i i-calendar-range" aria-hidden="true"><use href="#i-calendar-range"/></svg><span data-i18n="trip_days"></span></h2>
            <div class="trip-actions">
              <button class="btn ghost" id="tripIcs"><svg class="i i-calendar-plus" aria-hidden="true"><use href="#i-calendar-plus"/></svg><span data-i18n="trip_ics"></span></button>
              <button class="btn ghost" id="tripPrint"><svg class="i i-print" aria-hidden="true"><use href="#i-print"/></svg><span data-i18n="trip_print"></span></button>
              <button class="btn gold-btn" id="tripShare"><svg class="i i-share" aria-hidden="true"><use href="#i-share"/></svg><span data-i18n="share"></span></button>
            </div>
          </div>
          <div id="tripDays"></div>
        </section>
      </section>
